<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Córtex IA — Acesso Seguro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.08) 0%, rgba(10, 15, 29, 1) 75%);
            margin: 0;
            padding: 1rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f1f5f9;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.1);
            position: relative;
            z-index: 10;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            border-radius: 1rem;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
            margin-bottom: 1rem;
        }
        .login-logo svg {
            width: 28px;
            height: 28px;
            color: #ffffff;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin: 0;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-subtitle {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 0.35rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            letter-spacing: 0.01em;
        }
        .input-wrapper {
            position: relative;
        }
        .form-input {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #ffffff;
            font-size: 0.9375rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
            border: none;
            border-radius: 0.75rem;
            padding: 0.875rem;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .alert-box {
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.8125rem;
            margin-bottom: 1.25rem;
            display: none;
            line-height: 1.4;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .alert-info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1rem;
        }
        .modal-card {
            width: 100%;
            max-width: 440px;
            background: #0f172a;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 1.25rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(59, 130, 246, 0.2);
            animation: modalPop 0.3s ease-out;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .strength-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <h1 class="login-title">Córtex IA</h1>
            <div class="login-subtitle">Inteligência de Mercado & Trading Autônomo</div>
        </div>

        <div id="alert" class="alert-box"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">Usuário</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-input" placeholder="Digite seu usuário" required autocomplete="username" autofocus>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="Digite sua senha" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="btn-login" class="btn-submit">
                <span>Entrar no Sistema</span>
            </button>
        </form>
    </div>

    <div id="modal-first-login" class="modal-overlay">
        <div class="modal-card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div style="display: inline-flex; padding: 0.75rem; border-radius: 50%; background: rgba(59, 130, 246, 0.15); color: #60a5fa; margin-bottom: 0.75rem;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h2 style="font-size: 1.25rem; font-weight: 800; margin: 0; color: #ffffff;">Primeiro Acesso</h2>
                <p style="font-size: 0.8125rem; color: #94a3b8; margin-top: 0.35rem;">Por segurança, defina seu novo nome de usuário e uma senha pessoal exclusiva.</p>
            </div>

            <div id="modal-alert" class="alert-box"></div>

            <form id="first-login-form">
                <div class="form-group">
                    <label class="form-label" for="new-username">Novo Nome de Usuário</label>
                    <input type="text" id="new-username" class="form-input" placeholder="Ex: bernardo.trader" minlength="3" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="new-password">Nova Senha Forte</label>
                    <input type="password" id="new-password" class="form-input" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    <div class="strength-bar"><div id="strength-fill" class="strength-fill"></div></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirmar Nova Senha</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="Repita a nova senha" required>
                </div>

                <button type="submit" id="btn-save-credentials" class="btn-submit">
                    <span>Salvar Credenciais e Acessar</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const reason = urlParams.get('reason');
        const alertBox = document.getElementById('alert');
        const modalAlertBox = document.getElementById('modal-alert');
        const loginForm = document.getElementById('login-form');
        const firstLoginForm = document.getElementById('first-login-form');
        const modalFirst = document.getElementById('modal-first-login');
        const newPassInput = document.getElementById('new-password');
        const strengthFill = document.getElementById('strength-fill');

        let currentAuthUsername = '';
        let currentAuthPassword = '';

        if (reason === 'idle') {
            showAlert('Sua sessão foi encerrada automaticamente por inatividade.', 'alert-info');
        } else if (reason === 'expired') {
            showAlert('Sua sessão expirou. Por favor faça login novamente.', 'alert-info');
        }

        function showAlert(msg, type = 'alert-error') {
            alertBox.className = `alert-box ${type}`;
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
        }

        function showModalAlert(msg, type = 'alert-error') {
            modalAlertBox.className = `alert-box ${type}`;
            modalAlertBox.textContent = msg;
            modalAlertBox.style.display = 'block';
        }

        // Medidor de Força da Senha
        newPassInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let score = 0;
            if (val.length >= 6) score += 25;
            if (val.length >= 10) score += 25;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 25;
            if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score += 25;

            strengthFill.style.width = score + '%';
            if (score <= 25) strengthFill.style.backgroundColor = '#ef4444';
            else if (score <= 50) strengthFill.style.backgroundColor = '#f59e0b';
            else if (score <= 75) strengthFill.style.backgroundColor = '#3b82f6';
            else strengthFill.style.backgroundColor = '#10b981';
        });

        // Submit do Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<span>Verificando...</span>';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Erro ao realizar login.');
                }

                if (data.must_change_password) {
                    currentAuthUsername = username;
                    currentAuthPassword = password;
                    modalFirst.style.display = 'flex';
                    document.getElementById('new-username').value = '';
                    document.getElementById('new-username').focus();
                } else {
                    showAlert('Login realizado com sucesso! Redirecionando...', 'alert-success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                }
            } catch (err) {
                showAlert(err.message, 'alert-error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Entrar no Sistema</span>';
            }
        });

        // Submit do Primeiro Acesso
        firstLoginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save-credentials');
            const newUsername = document.getElementById('new-username').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                showModalAlert('As senhas digitadas não coincidem.', 'alert-error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>Atualizando credenciais...</span>';
            modalAlertBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/first-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        current_username: currentAuthUsername,
                        current_password: currentAuthPassword,
                        new_username: newUsername,
                        new_password: newPassword
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Erro ao atualizar credenciais.');
                }

                showModalAlert('Credenciais salvas com sucesso! Entrando...', 'alert-success');
                setTimeout(() => {
                    window.location.href = '/';
                }, 800);
            } catch (err) {
                showModalAlert(err.message, 'alert-error');
                btn.disabled = false;
                btn.innerHTML = '<span>Salvar Credenciais e Acessar</span>';
            }
        });
    </script>
</body>
</html>
